name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Lengkapi folder platform Android
        run: flutter create --org com.sandi --project-name aplikasi_toko --platforms android .

      - name: Atur tanda tangan APK & minSdk
        run: python3 tool/patch_android.py

      - name: Matikan lint vital (bug lint pada plugin)
        run: |
          F=android/build.gradle.kts
          [ -f "$F" ] || F=android/build.gradle
          if ! grep -q "lintVital" "$F"; then
            printf '\nsubprojects {\n    tasks.matching { it.name.startsWith("lintVital") }.configureEach { enabled = false }\n}\n' >> "$F"
          fi
          tail -5 "$F"

      - name: Ambil paket
        run: flutter pub get

      - name: Analisa kode
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tes
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Ganti nama APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AplikasiToko.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aplikasi-toko-apk
          path: build/app/outputs/flutter-apk/AplikasiToko.apk
